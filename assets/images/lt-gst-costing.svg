<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="ltBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1329"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="barGrad1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="barGrad2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="800" height="500" rx="16" fill="url(#ltBg)"/>
  
  <!-- Grid Lines -->
  <g stroke="#1E293B" stroke-width="1" stroke-dasharray="3 3">
    <line x1="60" y1="120" x2="740" y2="120"/>
    <line x1="60" y1="200" x2="740" y2="200"/>
    <line x1="60" y1="280" x2="740" y2="280"/>
    <line x1="60" y1="360" x2="740" y2="360"/>
  </g>

  <!-- Header Bar -->
  <rect x="40" y="30" width="720" height="42" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <circle cx="65" cy="51" r="5" fill="#3B82F6"/>
  <circle cx="82" cy="51" r="5" fill="#10B981"/>
  <text x="105" y="56" font-family="'JetBrains Mono', monospace" font-size="12" fill="#93C5FD">LARSEN &amp; TOUBRO // GST &amp; MARGINAL COSTING ENGINE</text>
  <rect x="625" y="41" width="120" height="20" rx="4" fill="#1D4ED8"/>
  <text x="685" y="55" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#FFFFFF" text-anchor="middle">TAX RECONCILED</text>

  <!-- Left: GST Compliance Modules -->
  <rect x="50" y="95" width="330" height="360" rx="10" fill="#0F172A" fill-opacity="0.85" stroke="#1E3A8A" stroke-width="1"/>
  <text x="75" y="130" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Statutory GST Framework</text>
  <text x="75" y="148" font-family="'JetBrains Mono', monospace" font-size="11" fill="#60A5FA">FINANCE DEPARTMENT TAX OPERATIONS</text>

  <!-- GSTR-1 Card -->
  <rect x="75" y="170" width="280" height="60" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="90" y="193" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#38BDF8">GSTR-1 Outward Supplies</text>
  <text x="90" y="212" font-family="'Inter', sans-serif" font-size="11" fill="#94A3B8">B2B, B2C invoice schedule &amp; HSN classification</text>

  <!-- GSTR-3B Card -->
  <rect x="75" y="242" width="280" height="60" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="90" y="265" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#A78BFA">GSTR-3B Monthly Return</text>
  <text x="90" y="284" font-family="'Inter', sans-serif" font-size="11" fill="#94A3B8">Input Tax Credit (ITC) matching &amp; tax offset</text>

  <!-- Reconciliation Status -->
  <rect x="75" y="315" width="280" height="115" rx="6" fill="#172554" fill-opacity="0.4" stroke="#2563EB" stroke-width="1"/>
  <text x="90" y="340" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#93C5FD">ITC RECONCILIATION 2B vs BOOKS</text>
  <rect x="90" y="355" width="250" height="10" rx="5" fill="#1E293B"/>
  <rect x="90" y="355" width="238" height="10" rx="5" fill="#10B981"/>
  <text x="90" y="382" font-family="'Inter', sans-serif" font-size="11" fill="#E2E8F0">Matched Invoices: 98.4% without variance</text>
  <text x="90" y="405" font-family="'Inter', sans-serif" font-size="10" fill="#64748B">Zero-penalty compliance &amp; timely offset</text>

  <!-- Right: Marginal Costing & Management Accounting -->
  <rect x="400" y="95" width="350" height="360" rx="10" fill="#0F172A" fill-opacity="0.85" stroke="#1E3A8A" stroke-width="1"/>
  <text x="425" y="130" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Management Accounting</text>
  <text x="425" y="148" font-family="'JetBrains Mono', monospace" font-size="11" fill="#F59E0B">MARGINAL COSTING &amp; CONTRIBUTION MARGIN</text>

  <!-- Chart Visual -->
  <g transform="translate(425, 175)">
    <!-- Axes -->
    <line x1="30" y1="160" x2="300" y2="160" stroke="#475569" stroke-width="1.5"/>
    <line x1="30" y1="20" x2="30" y2="160" stroke="#475569" stroke-width="1.5"/>

    <!-- Cost curve / Breakeven Line -->
    <path d="M 30 140 Q 150 110 300 30" fill="none" stroke="#38BDF8" stroke-width="2.5"/>
    <path d="M 30 110 L 300 70" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="4 3"/>

    <!-- Legend -->
    <circle cx="40" cy="185" r="4" fill="#38BDF8"/>
    <text x="50" y="189" font-family="'Inter', sans-serif" font-size="10" fill="#CBD5E1">Total Revenue Slope</text>
    <circle cx="170" cy="185" r="4" fill="#F59E0B"/>
    <text x="180" y="189" font-family="'Inter', sans-serif" font-size="10" fill="#CBD5E1">Total Cost (Fixed + Var)</text>

    <!-- Point of BEP -->
    <circle cx="165" cy="90" r="5" fill="#EF4444"/>
    <text x="180" y="93" font-family="'JetBrains Mono', monospace" font-size="9" fill="#FCA5A5">BREAK-EVEN POINT</text>
  </g>

  <!-- Metric highlight -->
  <rect x="425" y="380" width="300" height="55" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="440" y="402" font-family="'Inter', sans-serif" font-size="11" fill="#94A3B8">P/V Ratio &amp; Contribution Analysis</text>
  <text x="440" y="423" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#38BDF8">Optimal Pricing &amp; Volume Sensitivities</text>
</svg>
