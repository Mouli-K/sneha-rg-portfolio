<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="50%" stop-color="#312E81" />
      <stop offset="100%" stop-color="#4338CA" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#312E81" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="200" height="200" rx="100" fill="#F8FAFC" />
  <circle cx="100" cy="100" r="92" fill="url(#avatarGrad)" />
  <circle cx="100" cy="100" r="95" fill="none" stroke="url(#ringGrad)" stroke-width="2.5" stroke-dasharray="8 4" opacity="0.75"/>
  <!-- Elegant Initials Monogram SR -->
  <text x="100" y="112" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="52" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="-1.5">SR</text>
  <text x="100" y="142" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#E0E7FF" text-anchor="middle" letter-spacing="3" opacity="0.9">FINANCE &amp; OPS</text>
</svg>
